name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codegen:
    name: Generated code is up to date (oagen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codegen/package-lock.json

      - name: Set up uv (ruff formats the generated files)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: |
          uv sync --extra dev
          cd codegen && npm ci --ignore-scripts

      - name: Type-check and test the generator
        run: |
          cd codegen
          npm run typecheck
          npm test

      - name: Regenerate
        run: cd codegen && npm run sdk:generate

      - name: No drift between the pinned specs and the committed code
        run: |
          git status --porcelain
          git diff --stat --exit-code -- src tests/petstore_sdk

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --extra aiohttp

      - name: Lint
        run: |
          uv run ruff check src tests benchmarks
          uv run ruff format --check src tests benchmarks

      - name: Type check (pyright --strict, generated code included)
        run: uv run pyright

      - name: Tests
        run: uv run pytest -q

      - name: Benchmarks (pytest-benchmark; generated method within 10% of hand-written)
        run: uv run pytest benchmarks -q -p no:cacheprovider --benchmark-min-rounds=20 --benchmark-columns=min,mean,ops

      - name: Wheel contains the generated APIs
        run: |
          uv build --wheel
          uv run python -c "import glob, zipfile; n = [x for x in zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist() if x.startswith('amzn_selling_partner/sdk/resources/') and x.endswith('.py')]; assert len(n) > 60, n; print(len(n), 'resource modules in wheel')"
