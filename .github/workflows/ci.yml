name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --extra aiohttp

      - name: Lint
        run: |
          uv run ruff check src tests benchmarks scripts
          uv run ruff format --check src tests benchmarks scripts

      - name: Type check (pyright --strict on hand-written code)
        run: uv run pyright

      - name: Tests
        run: uv run pytest -q

      - name: Stubs are up to date
        run: uv run python -m spapi.stubgen --check

      - name: Smoke benchmark (dynamic op within 10% of hand-written)
        run: uv run python benchmarks/bench.py --iterations 100

      - name: Wheel contains the vendored specs
        run: |
          uv run python scripts/sync_specs.py
          uv build --wheel
          uv run python -c "import glob, zipfile; n = [x for x in zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist() if x.endswith('.json')]; assert len(n) > 60, n; print(len(n), 'spec files in wheel')"
