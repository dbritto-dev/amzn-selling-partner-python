name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Bump version, tag and release
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          # Self-limiting 0.x -> 1.0.0 transition: while still pre-1.0, a "bump" means
          # graduating to 1.0.0 (a real major bump), not another 0.x release. Once the
          # major version is 1 or higher this always falls through to a minor bump, so no
          # manual revert is needed after the 1.0.0 release.
          current_major="$(uv version --short | cut -d. -f1)"
          if [ "$current_major" = "0" ]; then
            uv version --bump major --no-sync
          else
            uv version --bump minor --no-sync
          fi
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git add pyproject.toml uv.lock
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Tag release
        run: |
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump.outputs.version }}"
          generate_release_notes: true

  build:
    name: Build distribution
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ needs.release.outputs.version }}"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"

      - name: Build package
        run: uv build --no-sources

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/amzn-selling-partner/
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Publish package to PyPI
        run: uv publish
