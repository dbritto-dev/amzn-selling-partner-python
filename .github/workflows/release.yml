name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to bump"
        type: choice
        options: [major, minor, patch]
        default: minor

jobs:
  release:
    name: Bump version, tag and release
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # A manual run picks the component; a push bumps minor, or major when the
      # head commit is marked breaking (`feat!:` / `refactor!:` or a
      # "BREAKING CHANGE" line, the conventional-commits markers).
      - name: Bump version
        id: bump
        env:
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          bump="${INPUT_BUMP:-minor}"
          if [ -z "$INPUT_BUMP" ] && printf '%s' "$HEAD_MESSAGE" | grep -Eq '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
            bump=major
          fi
          echo "bumping $bump"
          uv version --bump "$bump" --no-sync
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git add pyproject.toml uv.lock
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Tag release
        run: |
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump.outputs.version }}"
          generate_release_notes: true

  build:
    name: Build distribution
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ needs.release.outputs.version }}"
          submodules: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build --no-sources

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/amzn-selling-partner/
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Publish package to PyPI
        run: uv publish
