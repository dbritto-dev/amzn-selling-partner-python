name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Bump version, tag and release
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: bump
        run: |
          set -euo pipefail
          init_file="amzn_selling_partner/__init__.py"
          current=$(grep -oP '(?<=__version__ = ")[^"]+' "$init_file")
          IFS='.' read -r major minor patch <<< "$current"
          new="$major.$minor.$((patch + 1))"
          sed -i "s/__version__ = \"$current\"/__version__ = \"$new\"/" "$init_file"
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git add amzn_selling_partner/__init__.py
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Tag release
        run: |
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump.outputs.version }}"
          generate_release_notes: true
