[project]
name = "amzn-selling-partner"
version = "0.2.0"
description = "Spec-driven Python client for the Amazon Selling Partner API"
authors = [
  { name = "Danilo Britto", email = "dbritto.dev@gmail.com" },
]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx2>=2,<3",
  "pydantic>=2.9",
]
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
aiohttp = ["aiohttp[speedups]>=3.10", "httpx-aiohttp[httpx2]>=0.2"]
dev = [
  "pytest>=8",
  "ty>=0.0.80",
  "hypothesis>=6.100",
  "ruff>=0.16",
  "pytest-benchmark>=5",
]
security-test = ["bandit==1.9.4", "safety==2.3.4", "setuptools<81"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "amzn_selling_partner"

[tool.ruff]
line-length = 140
target-version = "py310"
exclude = ["build", ".venv", ".nox", "spec", "codegen"]

[tool.ruff.lint]
select = ["B", "C4", "E", "W", "F", "I", "Q", "UP"]
ignore = ["E501", "B904", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python = ".venv"
python-version = "3.10"
root = ["src", "tests"]

[tool.ty.src]
include = ["src/amzn_selling_partner", "tests/petstore_sdk"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:amzn_selling_partner.*"]
