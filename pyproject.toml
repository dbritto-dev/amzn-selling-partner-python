[build-system]
requires = ["flit"]
build-backend = "flit.buildapi"

[project]
name = "amzn-selling-partner"
authors = [
  { name = "Danilo Britto", email = "dbritto.dev@gmail.com" },
]
classifiers = [
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development",
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
]
dependencies = [
  "requests==2.34.2", "requests_aws4auth==1.2.2", "boto3==1.26.89",
  "pydantic==1.10.7"
]
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version", "description"]

[tool.flit.module]
name = "amzn_selling_partner"

[project.optional-dependencies]
dev = [
  "ruff==0.0.254", "black==23.1.0", "pytest==7.2.2", "coverage==7.2.3",
  "pytest-cov==4.0.0", "nox==2022.11.21", "bandit==1.7.5", "safety==2.3.4",
  "responses==0.23.1"
]
lint = ["ruff==0.0.254", "black==23.1.0"]
test = [
  "pytest==7.2.2", "coverage==7.2.3", "pytest-cov==4.0.0", "nox==2022.11.21",
  "responses==0.23.1"
]
security-test = ["bandit==1.7.5", "safety==2.3.4"]

[tool.ruff]
line-length = 99
target-version = "py39"
select = [
  # flake8-bugbear
  "B",
  # flake8-comprehensions and mccabe
  "C",
  # pycodestyle
  "E", "W",
  # pyflakes
  "F",
  # isort
  "I",
  # bandit
  "S",
  # flake8-quotes
  "Q",
  # pylint
  "PLE", "PLR", "PLW"
]
ignore = ["E501", "B904", "B008"]
exclude = [
  "build", "configs", "*.egg-info", ".github", ".githooks", ".vscode", ".nox"
]

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.per-file-ignores]
"tests/*.py" = ["S101"]

[tool.black]
line-length = 99
target-version = ["py39"]
preview = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["amzn_selling_partner"]
omit = ["amzn_selling_partner/client/auth.py"]

[tool.coverage.report]
fail_under = 90
